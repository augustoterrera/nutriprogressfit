services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nutriprogressfit
      POSTGRES_USER: nutriprogressfit
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriprogressfit -d nutriprogressfit"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
