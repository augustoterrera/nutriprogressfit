<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriProgressFit V11.2</title>
<style>
:root{--g:#12382b;--g2:#2d7655;--lime:#b9ee91;--bg:#f4f8f6;--card:#fff;--line:#dbe7e0;--ink:#17231e;--muted:#6b7972}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{height:68px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:900}.logo span{color:var(--lime)}.role{border:0;background:var(--lime);color:var(--g);padding:9px 14px;border-radius:99px;font-weight:800;cursor:pointer}
.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:250px;background:#173d2f;padding:12px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.nav{display:flex;flex-direction:column;gap:3px}.nav button{width:100%;border:0;background:transparent;color:#e8f2ed;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#2a5c49}
main{width:100%;max-width:1500px;margin:auto;padding:24px 26px 110px}.hero{background:linear-gradient(120deg,#173d2f,#4f9871);color:#fff;padding:32px;border-radius:24px;min-height:230px;position:relative;overflow:hidden;box-shadow:0 15px 40px #12382b22}.hero h1{position:relative;z-index:1;font-size:38px;margin:0 0 10px}.hero p,.hero button{position:relative;z-index:1;max-width:760px}.card{background:#ffffffef;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 28px #12382b0c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;transition:.2s}.tile:hover{transform:translateY(-4px)}.emoji{font-size:34px}.notice{background:#eef7f1;border-radius:11px;padding:13px}.muted{color:var(--muted)}.tag{display:inline-block;background:#e3f2e9;color:#245941;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}.btn{border:0;border-radius:10px;background:var(--g2);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#e8f1ec;color:#20503c}
label{display:block;font-size:12px;font-weight:750;margin:8px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd9d1;border-radius:9px;background:#fff;font:inherit}.bar{height:10px;background:#e5ece8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#58a879}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.calendar{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.week{min-width:920px}.whead,.wbody{display:grid;grid-template-columns:70px repeat(7,1fr)}.whead div{padding:9px;text-align:center;font-size:11px;font-weight:800;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.times div,.day{height:50px;border-bottom:1px solid #edf1ee}.times div{font-size:10px;color:#809087;padding:7px;text-align:right;border-right:1px solid var(--line)}.day{position:relative;border-right:1px solid var(--line)}.event{position:absolute;left:5px;right:5px;top:4px;padding:6px;background:#dff1e7;border-left:4px solid #4f9871;border-radius:8px;font-size:10px}.event.y{background:#fff0d8;border-left-color:#d69c3d}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.monthday{min-height:70px;border:1px solid #edf1ee;border-radius:8px;padding:7px}.monthday.today{background:#173d2f;color:#fff}.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.monthbox{border:1px solid var(--line);border-radius:12px;padding:10px}.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini span{font-size:9px;text-align:center;background:#f5f8f6;padding:4px;border-radius:4px}
.ai{position:fixed;right:20px;bottom:18px;z-index:40}.fab{border:0;background:var(--g);color:#fff;border-radius:99px;padding:14px 17px;font-weight:850;cursor:pointer;box-shadow:0 12px 35px #0003}.panel{display:none;width:395px;max-width:calc(100vw - 28px);height:535px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 70px #0004;overflow:hidden}.panel.open{display:flex;flex-direction:column}.aihead{background:var(--g);color:#fff;padding:14px;display:flex;justify-content:space-between}.aibody{flex:1;overflow:auto;padding:13px;background:#f7faf8}.msg{padding:10px 12px;border-radius:13px;margin:7px 0;font-size:13px}.bot{background:#e4f1e9}.me{background:#173d2f;color:#fff;margin-left:35px}.aifoot{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.aifoot input{margin:0;flex:1}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:60}.box{background:#fff;border-radius:20px;padding:24px;width:min(560px,100%)}
@media(max-width:850px){aside{width:66px}.nav button{font-size:0;text-align:center}.tiles{grid-template-columns:1fr}.yeargrid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">🥗 NutriProgress<span>Fit</span></div><button id="roleBtn" class="role">Elegir perfil</button></header>
<div class="layout"><aside><div id="nav" class="nav"></div></aside><main id="main"></main></div>
<div class="ai"><div id="panel" class="panel"><div class="aihead"><b>🤖 ATLAS IA NutriProgressFit</b><button id="closeAI" class="btn alt">Cerrar</button></div><div id="aiBody" class="aibody"><div class="msg bot"><b>ATLAS IA activo.</b><br>Copiloto técnico disponible.</div></div><div class="aifoot"><input id="aiInput" placeholder="Consultá a ATLAS IA..."><button id="sendAI" class="btn">Enviar</button></div></div><button id="fab" class="fab">🤖 ATLAS IA</button></div>
<div id="modal"></div>
<script>
var profiles={
"Administrador PRO":["Inicio","Usuarios","Suscripciones","Pagos y comisiones","Agenda","Comunidad profesional","Configuración"],
"Nutricionista":["Inicio","Mi perfil profesional","Mis pacientes","Anamnesis","Agenda","Antropometría","Gasto calórico","Armador de planes","Base de alimentos","Rutinas","IA clínica","Control diario","Comunidad profesional","Chat IA 24 hs","Dispositivos","Tienda"],
"Entrenador":["Inicio","Mi perfil profesional","Mis pacientes","Agenda","Antropometría","Gasto calórico","Rutinas","IA de entrenamiento","Control diario","Comunidad profesional","Chat IA 24 hs","Dispositivos","Tienda"],
"Paciente":["Inicio","Mi perfil","Mi plan alimentario","Mi rutina","Agenda","Control diario","Progreso corporal","Chat IA 24 hs","Profesionales en línea","Mis dispositivos","Tienda"]
};
var icons={"Administrador PRO":"👑","Nutricionista":"🥗","Entrenador":"🏋️","Paciente":"👤"};
var role=null,page="Inicio",agendaMode="week";
var micronutrients=["Vitamina A","Vitamina C","Vitamina D","Vitamina E","Vitamina K","B1","B2","B3","B5","B6","B7","B9 (folato)","B12","Calcio","Hierro","Magnesio","Fósforo","Potasio","Sodio","Zinc","Cobre","Manganeso","Selenio","Yodo","Cromo","Molibdeno","Flúor"];
function $(id){return document.getElementById(id)}
function card(t,b){return '<section class="card"><h2>'+t+'</h2>'+b+'</section>'}
function toast(t){alert(t)}
function openRoles(){
var modal=$("modal");modal.innerHTML='<div class="modal"><div class="box"><h2>Ingresar a NutriProgressFit</h2><p>Elegí un perfil de prueba:</p><div id="roleList"></div></div></div>';
var list=$("roleList");Object.keys(profiles).forEach(function(r){var b=document.createElement("button");b.className="btn";b.style="width:100%;margin:5px 0";b.textContent=icons[r]+" "+r;b.onclick=function(){role=r;page="Inicio";modal.innerHTML="";render()};list.appendChild(b)})
}
function renderNav(){
var nav=$("nav");nav.innerHTML="";var c=document.createElement("button");c.textContent="🔄 Cambiar perfil";c.onclick=openRoles;nav.appendChild(c);
if(role)profiles[role].forEach(function(x){var b=document.createElement("button");b.textContent="▸ "+x;b.className=x===page?"active":"";b.onclick=function(){page=x;render()};nav.appendChild(b)})
}
function render(){
renderNav();$("roleBtn").textContent=role?icons[role]+" "+role:"Elegir perfil";var h="";
if(!role){h='<div class="hero"><h1>🥗 Bienvenido a NutriProgressFit</h1><p>Nutrición, entrenamiento, agenda, seguimiento y salud.</p><button id="start" class="btn">Comenzar demo</button></div><div class="tiles"><div class="tile"><div class="emoji">🥗</div><h3>Nutrición</h3><p class="muted">Planes y alimentos.</p></div><div class="tile"><div class="emoji">📅</div><h3>Agenda</h3><p class="muted">Turnos y controles.</p></div><div class="tile"><div class="emoji">🤖</div><h3>ATLAS IA</h3><p class="muted">Copiloto profesional.</p></div></div>';$("main").innerHTML=h;$("start").onclick=openRoles;return}
if(page==="Inicio")h='<div class="hero"><h1>'+icons[role]+' '+role+'</h1><p>Panel moderno de NutriProgressFit.</p><button id="openAI" class="btn">Abrir ATLAS IA</button></div>'+card("Accesos rápidos",'<div class="grid"><div class="notice">📅 Agenda</div><div class="notice">👥 Pacientes</div><div class="notice">🧬 Antropometría</div><div class="notice">🥗 Planes</div><div class="notice">🍎 Alimentos</div><div class="notice">📋 Control diario</div></div>');
else if(page==="Mis pacientes")h='<h1>👥 Mis pacientes</h1>'+card("Listado",'<button class="btn" onclick="toast(\'Nuevo paciente — DEMO\')">+ Nuevo paciente</button><div class="grid"><div class="notice">María González<br><b>68,4 kg</b><br>Plan activo</div><div class="notice">Carlos Rodríguez<br><b>82 kg</b><br>Plan activo</div></div>');
else if(page==="Anamnesis")h='<h1>📋 Anamnesis</h1>'+card("Historia nutricional",'<div class="grid"><div><label>Motivo</label><input></div><div><label>Objetivo</label><input></div><div><label>Antecedentes</label><textarea></textarea></div><div><label>Hábitos</label><textarea></textarea></div></div><button class="btn" onclick="toast(\'Anamnesis guardada — DEMO\')">Guardar</button>');
else if(page==="Tienda")h='<h1>🛒 Tienda / Catálogo</h1>'+card("Servicios",'<div class="grid"><div class="notice"><b>Primera consulta</b><br>ARS 45.000<br><button class="btn">Editar</button></div><div class="notice"><b>Seguimiento</b><br>ARS 45.000<br><button class="btn">Editar</button></div><div class="notice"><b>Pack x4</b><br>ARS 126.000<br><button class="btn">Editar</button></div></div>')+card("Productos",'<button class="btn" onclick="toast(\'Nuevo producto — DEMO\')">+ Nuevo producto</button>');
else if(page==="Base de alimentos")h='<h1>🍎 Base de alimentos</h1>'+card("Biblioteca",'<div class="grid"><div><label>Buscar</label><input placeholder="Pollo, arroz, avena..."></div><div><label>Fuente</label><select><option>SARA / SARA2</option><option>USDA</option><option>FAO/INFOODS</option></select></div><div><label>Categoría</label><select><option>Todas</option><option>Cereales</option><option>Carnes</option><option>Lácteos</option></select></div></div><button class="btn" id="foodAdd">+ Agregar al plan</button>')+card("Alimentos",'<table><tr><th>Alimento</th><th>Base</th><th>Porción</th><th>Kcal</th><th>CH</th><th>Prot.</th><th>Grasa</th></tr>'+["Abadejo crudo","Aceite de canola","Aceite de chía","Aceite de coco","Aceite de girasol","Aceite de maíz","Aceite de oliva"].map(function(x,i){return '<tr><td>'+x+'</td><td><span class="tag">SARA2</span></td><td>100 g</td><td>'+(72+i*10)+'</td><td>0 g</td><td>'+(i===0?16:0)+' g</td><td>'+(i===0?1:100)+' g</td></tr>'}).join("")+'</table>');
else if(page==="Control diario")h='<h1>📋 Control diario</h1>'+card("Registro",'<label>¿Qué comiste hoy?</label><textarea placeholder="Desayuno, almuerzo, merienda, cena..."></textarea><label>Fotos</label><input type="file" accept="image/*" multiple><br><br><button class="btn" id="dailySave">Guardar</button> <button class="btn alt" id="dailyAI">Analizar con ATLAS IA</button>')+card("Adherencia",'<div class="grid"><div><div style="font-size:30px;font-weight:900">82%</div>Adherencia</div><div><b>Proteínas</b><div class="bar"><i style="width:78%"></i></div><b>Carbohidratos</b><div class="bar"><i style="width:70%"></i></div><b>Grasas</b><div class="bar"><i style="width:64%"></i></div><b>Fibra</b><div class="bar"><i style="width:60%"></i></div><b>Kcal</b><div class="bar"><i style="width:86%"></i></div><b>Micronutrientes</b><div class="bar"><i style="width:68%"></i></div></div></div>');
else if(page==="Mi perfil profesional")h='<h1>👤 Perfil profesional</h1>'+card("Estado",'<div class="grid"><div><span class="tag">33% completado</span><h2>2 de 6</h2><div class="bar"><i style="width:33%"></i></div></div><div><p>✓ Matrícula</p><p>✓ Foto</p><p>✓ WhatsApp</p><p>○ Sede</p><p>○ Biografía</p><p>○ Especialidad</p></div></div>')+card("Verificación y datos",'<div class="grid"><div><label>Profesión</label><select><option>Lic. en Nutrición</option><option>Entrenador</option></select><label>País</label><input value="Argentina"><label>Jurisdicción</label><input><label>MN</label><input><label>MP</label><input></div><div><label>Comprobante</label><input type="file" accept=".pdf,image/*"><label>Ciudad / sede</label><input><label>WhatsApp</label><input><label>Especialidad</label><input><label>Sobre mí</label><textarea></textarea></div></div><button class="btn" onclick="toast(\'Perfil guardado — DEMO\')">Guardar cambios</button>')+card("Visibilidad",'<div class="grid">'+["Mostrar perfil público","Servicios y precios","Reservas online","Reseñas","Ubicación","Trayectoria","Certificaciones","Galería"].map(function(x){return '<label><input type="checkbox" checked> '+x+'</label>'}).join("")+'</div>')+card("Foto y redes",'<label>Foto de perfil</label><input type="file" accept="image/*"><div class="grid">'+["Instagram","Facebook","LinkedIn","TikTok","YouTube","Sitio web"].map(function(x){return '<div><label>'+x+'</label><input></div>'}).join("")+'</div>');
else if(page==="Agenda")h=agenda();
else if(page==="Antropometría")h='<h1>🧬 Antropometría</h1>'+card("Bioimpedancia / InBody",'<input type="file" accept="image/*,.pdf"><br><br><button class="btn" onclick="toast(\'OCR de informe — DEMO\')">Analizar</button>')+card("ISAK 1 · 2 · 3",'<div class="grid">'+["Tríceps","Subescapular","Bíceps","Cresta ilíaca","Supraespinal","Abdominal","Muslo frontal","Pantorrilla medial"].map(function(x){return '<div><label>'+x+' (mm)</label><input type="number"></div>'}).join("")+'</div>')+card("Resumen",'<b>40 kg músculo = 50% del peso</b><div class="bar"><i style="width:50%"></i></div><b>19,4% grasa</b><div class="bar"><i style="width:19.4%"></i></div>');
else if(page==="Gasto calórico")h='<h1>🔥 Gasto calórico</h1>'+card("Fórmulas",'<div class="grid"><div><label>Fórmula</label><select><option>Mifflin-St Jeor</option><option>Harris-Benedict revisada</option><option>Harris-Benedict original</option><option>FAO/OMS/UNU</option><option>Oxford/Henry</option><option>Katch-McArdle</option></select></div><div><label>Nivel estándar</label><select><option>Sedentaria / muy leve · 1,20</option><option>Leve · 1,375</option><option selected>Moderada · 1,55</option><option>Intensa · 1,725</option><option>Muy intensa · 1,90</option></select></div><div><label>Actividad específica (MET)</label><select><option>Caminar suave · 2,9 MET</option><option>Caminar moderado · 3,5 MET</option><option>Aeróbico bajo impacto · 4,8 MET</option><option>Actividad vigorosa · 6,0 MET</option><option>Trote general · 7,5 MET</option><option>Básquet partido · 8,0 MET</option><option>Running rápido · 9,3 MET</option><option>HIIT vigoroso · 11 MET</option><option>Running muy rápido · 13 MET</option></select></div><div><label>Duración (min/día)</label><input type="number" value="60"></div><div><label>Peso</label><input value="70"></div><div><label>Talla</label><input value="175"></div><div><label>Edad</label><input value="30"></div></div><button class="btn" onclick="toast(\'Resultado DEMO calculado\')">Calcular</button>');
else if(page==="Armador de planes")h='<h1>🥗 Armador de planes</h1>'+card("Manual + ATLAS IA",'<label>Kcal objetivo</label><input value="2200"><label>Instrucciones</label><textarea>Déficit leve, proteína adecuada, alimentos argentinos.</textarea><button class="btn" onclick="toast(\'Plan generado por ATLAS IA y editable — DEMO\')">Generar con IA</button> <button class="btn alt" onclick="toast(\'Editor manual activado\')">Editar</button>')+card("Macros y micronutrientes",'<div class="grid">'+["Proteínas","Carbohidratos","Grasas","Fibra"].concat(micronutrients).map(function(x,i){return '<div>'+x+'<div class="bar"><i style="width:'+(52+i%5*9)+'%"></i></div></div>'}).join("")+'</div>');
else if(page==="Rutinas"||page==="IA de entrenamiento")h='<h1>🏋️ Rutinas</h1>'+card("Manual + ATLAS IA",'<label>Objetivo</label><select><option>Fuerza</option><option>Hipertrofia</option><option>Definición</option></select><label>Instrucciones</label><textarea>4 días por semana.</textarea><button class="btn" onclick="toast(\'Rutina generada y editable — DEMO\')">Generar</button><label>Video</label><input type="file" accept="video/*">');
else if(page==="IA clínica")h='<h1>🤖 ATLAS IA clínica</h1>'+card("Contexto del paciente",'<p>En producción: historia clínica, anamnesis, mediciones, estudios, laboratorios, objetivos, planes y diario.</p><textarea rows="6"></textarea><button class="btn" onclick="toast(\'Respuesta contextual ATLAS IA — DEMO\')">Consultar</button>');
else if(page==="Comunidad profesional")h='<h1>👥 Comunidad profesional</h1><p>Solo nutricionistas y entrenadores.</p>'+card("Biblioteca compartida",'<div class="grid"><div class="notice"><b>PLAN ALIMENTARIO 2500 KCAL PARA CELÍACOS HOMBRE</b><br>Gratuito</div><div class="notice"><b>RUTINA DEFINICIÓN MEN’S PHYSIQUE</b><br>Gratuita</div></div>');
else if(page==="Dispositivos"||page==="Mis dispositivos")h='<h1>⌚ Dispositivos</h1>'+card("Conectividad",'<div class="grid"><div class="notice">Apple Health / HealthKit</div><div class="notice">Google Health Connect</div><div class="notice">Bluetooth BLE</div><div class="notice">Cintas / bicicletas</div></div><button class="btn" onclick="toast(\'Conexión DEMO\')">Conectar</button>');
else if(page==="Mi plan alimentario")h='<h1>🥗 Mi plan alimentario</h1>'+card("Plan semanal",'<div class="grid"><div class="notice">Desayuno</div><div class="notice">Almuerzo</div><div class="notice">Merienda</div><div class="notice">Cena</div></div><br><button class="btn alt" onclick="window.print()">PDF</button> <button class="btn alt" onclick="toast(\'Excel DEMO\')">Excel</button>');
else if(page==="Mi rutina")h='<h1>🏋️ Mi rutina</h1>'+card("Rutina",'<div class="notice">4 sesiones semanales.</div>');
else if(page==="Comidas y nutrientes")h=dailyPage();
else if(page==="Progreso corporal")h='<h1>📊 Progreso corporal</h1>'+card("Evolución",'<div class="grid"><div class="notice">Peso inicial <b>82 kg</b></div><div class="notice">Peso actual <b>79,8 kg</b></div><div class="notice">Grasa <b>19,4%</b></div></div>');
else if(page==="Chat IA 24 hs")h='<h1>💬 Chat IA 24 hs</h1>'+card("ATLAS IA",'<button class="btn" id="chatOpen">Abrir asistente</button>')+card("Profesionales en línea",'<div class="grid"><div class="notice">🟢 Nutricionista Ana · ARS 8.000</div><div class="notice">🟢 Entrenador Martín · ARS 6.000</div></div>');
else if(page==="Profesionales en línea")h='<h1>🧑‍⚕️ Profesionales en línea</h1>'+card("Consultas",'<div class="grid"><div class="notice">🟢 Nutricionista Ana · ARS 8.000</div><div class="notice">🟢 Entrenador Martín · ARS 6.000</div></div>');
else if(page==="Mi perfil")h='<h1>👤 Mi perfil</h1>'+card("Datos",'<label>Foto</label><input type="file" accept="image/*"><label>Nombre</label><input><label>Celular</label><input>');
else h='<h1>'+page+'</h1>'+card("Demo",'<p>Sección disponible.</p>');
$("main").innerHTML=h;bindPage();
}
function dailyPage(){return '<h1>📋 Control diario</h1>'+card("Registro",'<label>Qué comiste</label><textarea placeholder="Desayuno, almuerzo, merienda, cena..."></textarea><label>Fotos</label><input type="file" accept="image/*" multiple><br><br><button class="btn" id="dailySave">Guardar</button> <button class="btn alt" id="dailyAI">Analizar con ATLAS IA</button>')+card("Adherencia",'<div class="grid"><div><div style="font-size:30px;font-weight:900">82%</div>Adherencia</div><div><b>Proteínas</b><div class="bar"><i style="width:78%"></i></div><b>Carbohidratos</b><div class="bar"><i style="width:70%"></i></div><b>Grasas</b><div class="bar"><i style="width:64%"></i></div><b>Fibra</b><div class="bar"><i style="width:60%"></i></div><b>Kcal</b><div class="bar"><i style="width:86%"></i></div><b>Micronutrientes</b><div class="bar"><i style="width:68%"></i></div></div></div>')}
function agenda(){var b=agendaMode==="week"?week():agendaMode==="month"?month():year();return '<div><h1>📅 Agenda profesional</h1><button class="btn" id="newAppt">+ Nuevo turno</button> <button class="btn alt" id="weekBtn">Semana</button> <button class="btn alt" id="monthBtn">Mes</button> <button class="btn alt" id="yearBtn">Año</button></div>'+b}
function week(){var ds=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],ts=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00"],r='<div class="times">'+ts.map(function(t){return "<div>"+t+"</div>"}).join("")+'</div>';ds.forEach(function(_,j){r+="<div>";ts.forEach(function(_,i){r+='<div class="day">'+(j===0&&i===1?'<div class="event"><b>Renata Pérez</b><br>Consulta</div>':j===2&&i===3?'<div class="event y"><b>Mateo Rodríguez</b><br>Control</div>':"")+"</div>"});r+="</div>"});return card("Semana actual",'<div class="calendar"><div class="week"><div class="whead"><div></div>'+ds.map(function(d){return "<div>"+d+"</div>"}).join("")+'</div><div class="wbody">'+r+"</div></div></div>")}
function month(){var n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),x="";for(var i=1;i<=d;i++)x+='<div class="monthday '+(i===n.getDate()?"today":"")+'"><b>'+i+"</b><br><span>"+(i%5===0?"2 turnos":"")+"</span></div>";return card(n.toLocaleString("es-AR",{month:"long",year:"numeric"}),'<div class="monthgrid">'+x+"</div>")}
function year(){var y=new Date().getFullYear(),o='<div class="yeargrid">';for(var m=0;m<12;m++){var d=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),x="";for(var i=1;i<=days;i++)x+="<span>"+i+"</span>";o+='<div class="monthbox"><h3>'+d.toLocaleString("es-AR",{month:"long"})+'</h3><div class="mini">'+x+"</div></div>"}return card("Calendario anual "+y,o+"</div>")}
function openAI(){$("panel").classList.add("open");$("fab").style.display="none";$("aiInput").focus()}
function closeAI(){$("panel").classList.remove("open");$("fab").style.display="block"}
function sendAI(){var v=$("aiInput").value.trim();if(!v)return;$("aiBody").innerHTML+='<div class="msg me">'+esc(v)+'</div>';$("aiInput").value="";setTimeout(function(){$("aiBody").innerHTML+='<div class="msg bot"><b>ATLAS IA — DEMO</b><br>En producción usaré el contexto autorizado del paciente y priorizaré SARA/SARA2 → USDA → FAO/INFOODS. Solicitaré datos faltantes y el profesional aprobará la salida.</div>';$("aiBody").scrollTop=$("aiBody").scrollHeight},200)}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
$("roleBtn").onclick=openRoles;$("fab").onclick=openAI;$("closeAI").onclick=closeAI;$("sendAI").onclick=sendAI;$("aiInput").onkeydown=function(e){if(e.key==="Enter")sendAI()};
render();
